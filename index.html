
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Radar Simulator</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  padding: 22px;
}
h1 { color: #ff2929; text-align: center; }
.panel {
  background: #151515;
  border: 1px solid #792020;
  border-radius: 16px;
  padding: 18px;
  margin: 16px 0;
}
.radar {
  width: min(82vw, 330px);
  aspect-ratio: 1;
  border: 2px solid #ff3030;
  border-radius: 50%;
  margin: 20px auto;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(90deg, transparent 49.5%, #682020 50%, transparent 50.5%),
    linear-gradient(transparent 49.5%, #682020 50%, transparent 50.5%),
    repeating-radial-gradient(circle, transparent 0 39px, #642020 40px 41px);
}
.dot {
  width: 11px;
  height: 11px;
  background: #ff3434;
  border-radius: 50%;
  position: absolute;
  box-shadow: 0 0 12px red;
}
button {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  background: #a20e18;
  border: 1px solid #ff3434;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
button:active { background: #e22230; }
.status { color: #ff5555; text-align: center; }
small { color: #aaa; }
</style>
</head>
<body>

<h1>⚡ BATTLE RADAR</h1>
<p class="status">● SIMULATION ONLINE</p>

<div class="panel">
  <h3>RADAR DISPLAY</h3>
  <div class="radar" id="radar">
    <div class="dot" style="left:25%;top:30%"></div>
    <div class="dot" style="left:70%;top:25%"></div>
    <div class="dot" style="left:55%;top:70%"></div>
    <div class="dot" style="left:30%;top:75%"></div>
  </div>
  <small>Training targets – simulated positions only</small>
</div>

<div class="panel">
  <h3>CONTROL CENTER</h3>
  <button onclick="toggleRadar()">RADAR ON / OFF</button>
  <button onclick="addTargets()">GENERATE TARGETS</button>
  <button onclick="clearTargets()">CLEAR RADAR</button>
</div>

<div class="panel">
  <h3>AIM TRAINING</h3>
  <p>Score: <strong id="score">0</strong></p>
  <p id="message">Tap Start to begin training.</p>
  <button onclick="startTraining()">START AIM TRAINING</button>
  <div id="training"></div>
</div>

<p class="status">BATTLE RADAR SIMULATOR V1.0</p>
<p style="text-align:center"><small>Independent training simulation. Not connected to PUBG.</small></p>

<script>
const radar = document.getElementById("radar");
let radarOn = true;
let score = 0;

function toggleRadar() {
  radarOn = !radarOn;
  radar.style.opacity = radarOn ? "1" : "0.15";
}

function addTargets() {
  clearTargets();
  for (let i = 0; i < 8; i++) {
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.left = (10 + Math.random() * 80) + "%";
    dot.style.top = (10 + Math.random() * 80) + "%";
    radar.appendChild(dot);
  }
}

function clearTargets() {
  radar.querySelectorAll(".dot").forEach(dot => dot.remove());
}

function startTraining() {
  score = 0;
  document.getElementById("score").textContent = score;
  document.getElementById("message").textContent =
    "Tap the red targets as quickly as possible!";
  nextTarget();
}

function nextTarget() {
  const area = document.getElementById("training");
  area.innerHTML = "";
  const target = document.createElement("button");
  target.textContent = "🎯 HIT TARGET";
  target.style.background = "#d41424";
  target.onclick = () => {
    score++;
    document.getElementById("score").textContent = score;
    nextTarget();
  };
  area.appendChild(target);
}
</script>

</body>
</html>
