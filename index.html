<!DOCTYPE html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Radar</title>
<style>
body {
  background: #050b08;
  color: #00ff66;
  font-family: Arial;
  text-align: center;
}
h1 { color: #00ff66; }
.radar {
  width: 300px;
  height: 300px;
  max-width: 85vw;
  max-height: 85vw;
  margin: 30px auto;
  border: 3px solid #00ff66;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  background: repeating-radial-gradient(
    circle, transparent 0 35px,
    #176b35 36px 37px
  );
}
.radar:before {
  content: "";
  position: absolute;
  width: 50%;
  height: 50%;
  left: 50%;
  top: 0;
  transform-origin: bottom left;
  background: linear-gradient(45deg,
    transparent, #00ff6655);
  animation: scan 3s linear infinite;
}
@keyframes scan {
  to { transform: rotate(360deg); }
}
.dot {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ff3333;
  border-radius: 50%;
  box-shadow: 0 0 10px red;
}
.one { left: 65%; top: 30%; }
.two { left: 30%; top: 60%; }
.three { left: 55%; top: 75%; }
</style>
</head>
<body>
<h1>MINI RADAR</h1>
<p>RADAR SYSTEM ONLINE</p>
<div class="radar">
  <div class="dot one"></div>
  <div class="dot two"></div>
  <div class="dot three"></div>
</div>
<p>Rote Punkte: simulierte Signale</p>
</body>
</html>
